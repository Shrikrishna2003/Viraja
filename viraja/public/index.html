<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIRAJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#050506;--ink2:#121216;--bg:#0c0c0f;--card:#141418;--line:#26262c;--text:#f1f1f3;--mute:#9b9ba6;--brand:#e5283a;--brandbg:rgba(229,40,58,.14);--amber:#e5a13a;--amberbg:rgba(229,161,58,.14);--red:#ff5a66;--redbg:rgba(229,40,58,.16);--good:#35c27c;--goodbg:rgba(53,194,124,.14);--input:#0f0f13;--bd2:#33333b;--track:#2a2a31;--krishbg:#1a0d10;--krishline:#4a1217}
:root[data-theme=light]{color-scheme:light;--bg:#f6f4f4;--card:#fff;--line:#e7e1e2;--text:#17171a;--mute:#6b6b76;--brandbg:rgba(229,40,58,.1);--amber:#a86a0c;--amberbg:rgba(229,161,58,.18);--red:#c4202f;--redbg:rgba(229,40,58,.1);--good:#1d8a55;--goodbg:rgba(29,138,85,.12);--input:#fff;--bd2:#d6cfd1;--track:#e9e3e4;--krishbg:#fff2f3;--krishline:#f0c4c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brandp{background:radial-gradient(120% 90% at 0% 0%,#3d0a10 0%,var(--ink) 58%);color:#e8eef7;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.brandp h2{font-size:38px;line-height:1.1;letter-spacing:-.025em;margin:0 0 14px;max-width:420px}
.brandp p{color:#a0a0ab;max-width:380px;margin:0}
.demo{background:var(--ink2);border:1px solid #2a2a31;border-radius:14px;padding:20px;display:flex;gap:18px;align-items:center;max-width:420px}
.formp{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:370px}
.box h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
.logo{text-transform:uppercase;font-weight:700;font-size:19px;letter-spacing:.14em}
.logo b{color:#ff3d4f}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--bd2);border-radius:8px;padding:11px 12px}
textarea{min-height:170px;resize:vertical}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;font-weight:600;padding:11px 18px;cursor:pointer;width:100%;margin-top:18px}
.btn.sm{width:auto;margin:0;padding:9px 16px}
.btn.ghost{background:var(--input);color:var(--text);border:1px solid var(--bd2)}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
.mute{color:var(--mute)}.small{font-size:13px}.err{color:var(--red);font-weight:600;margin-top:12px;min-height:1px}.ok{color:var(--good);font-weight:600;margin-top:12px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--ink);color:#b4b4be;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{color:#fff;padding:0 10px 18px}
aside button.nav{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
aside button.nav[aria-current=true]{background:var(--brandbg);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.who{margin-top:auto;padding:12px;border-top:1px solid #2a2a31;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.who .link{color:#ff7a85}
main{padding:32px;max-width:980px;width:100%}
h3{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.card h4{margin:0 0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{display:block;border:1.5px dashed var(--bd2);border-radius:10px;padding:22px;text-align:center;cursor:pointer;color:var(--mute);margin:0}
.drop:hover,.drop:focus-within{border-color:var(--brand);background:var(--brandbg)}
.drop input{display:none}.drop b{color:var(--text)}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 11px;margin:0 6px 6px 0;border-radius:99px;font-size:13.5px;font-weight:500;background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--redbg);color:var(--red)}.chip.warn{background:var(--amberbg);color:var(--amber)}
ul,ol{margin:0;padding-left:20px}li{margin-bottom:9px}
.rw{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;color:var(--mute);font-weight:600}
td select{width:auto;padding:5px 8px;font-weight:600;border-radius:99px}
.x{background:none;border:0;color:var(--red);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.2}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:var(--card);border-radius:50%}
.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:26px;font-weight:700}
.leg div{display:flex;align-items:center;gap:8px;margin-bottom:5px}.leg i{width:10px;height:10px;border-radius:3px}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px}
.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.cols i{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.sk{display:grid;grid-template-columns:100px 1fr 24px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.pw{position:relative}.pw input{padding-right:64px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;padding:8px}.eye:hover{color:var(--text)}
.trk{stroke:var(--track)}
.tbtn{position:fixed;right:16px;bottom:16px;z-index:9;background:var(--card);color:var(--text);border:1px solid var(--bd2);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}
.krish{border-color:var(--krishline);background:linear-gradient(180deg,var(--krishbg),var(--card))}
@media(max-width:820px){
.auth{grid-template-columns:1fr}.brandp{display:none}
.shell{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;height:auto;position:static;align-items:center;padding:12px}
aside .logo{padding:0 8px 0 0}.who{margin:0 0 0 auto;border:0;padding:0}
main{padding:20px 16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<button id="theme" class="tbtn" aria-label="Switch between light and dark mode"></button>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUSES=["Applied","OA","Interview","Offer","Rejected"];
const COL={Applied:"#8b8b97",OA:"#e5a13a",Interview:"#3b9ae8",Offer:"#35c27c",Rejected:"#e5283a"};
let U=null,last=null;

async function api(p,o={}){
  const h={};
  if(o.json){h["Content-Type"]="application/json";o.body=JSON.stringify(o.json)}
  const r=await fetch(p,{method:o.method,body:o.body,headers:h});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&U){U=null;authView("login");throw new Error("Your session expired. Sign in again.")}
  if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Check the fields and try again.");
  return d;
}
async function logout(){try{await fetch("/api/logout",{method:"POST"})}catch(e){}U=null;authView("login")}
const chips=(a,c="")=>a.length?a.map(x=>`<span class="chip ${c}">${esc(x)}</span>`).join(""):'<span class="mute">None</span>';
const ring=(sc,sz=150)=>{const C=2*Math.PI*52,col=sc>=70?"#35c27c":sc>=40?"#e5a13a":"#e5283a";
  return `<svg viewBox="0 0 120 120" width="${sz}" height="${sz}" role="img" aria-label="Match score ${sc}%"><circle cx="60" cy="60" r="52" fill="none" class="trk" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-sc/100)}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor">${sc}%</text></svg>`};

/* ---------- auth ---------- */
function authView(mode){
  const M={
    login:["Welcome back","Sign in to pick up where you left off.","Sign in"],
    signup:["Create your account","Track every application in one place.","Create account"],
    forgot:["Reset your password","Enter your email and we'll send a reset link.","Send reset link"],
    reset:["Choose a new password","Use at least 8 characters.","Save new password"]}[mode];
  $("#root").innerHTML=`<div class="auth">
  <div class="brandp"><div class="logo">VIRA<b>JA</b></div>
    <div><h2>Know where you stand before you apply.</h2><p>Match your resume to any job, see the exact skill gaps, and track every application through to the offer.</p></div>
    <div class="demo"><div style="color:#fff">${ring(78,96)}</div><div class="small"><div style="margin-bottom:8px;color:#fff;font-weight:600">Python Developer</div><span class="chip">Python</span><span class="chip">Flask</span><span class="chip">SQL</span><span class="chip bad">Docker</span><span class="chip bad">AWS</span></div></div></div>
  <div class="formp"><div class="box"><h1>${M[0]}</h1><p class="mute">${M[1]}</p>
    ${mode==="signup"?'<label for="n">Name</label><input id="n" autocomplete="name">':""}
    ${mode!=="reset"?'<label for="e">Email</label><input id="e" type="email" autocomplete="email">':""}
    ${mode!=="forgot"?`<label for="p">${mode==="reset"?"New password":"Password"}</label><div class="pw"><input id="p" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}"><button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">Show</button></div>`:""}
    ${mode==="login"?'<div style="text-align:right;margin-top:8px"><button class="link small" data-m="forgot">Forgot password?</button></div>':""}
    <button class="btn" id="go">${M[2]}</button><div id="am" role="status"></div>
    <p class="mute small" style="margin-top:20px">${mode==="login"?'New here? <button class="link" data-m="signup">Create an account</button>':'<button class="link" data-m="login">Back to sign in</button>'}</p>
  </div></div></div>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{history.replaceState(null,"","/");authView(b.dataset.m)});
  const go=async()=>{
    const v=id=>($("#"+id)||{}).value||"",m=$("#am");m.className="";m.textContent="";$("#go").disabled=true;
    try{
      if(mode==="forgot"){const f=await api("/api/forgot",{method:"POST",json:{email:v("e")}});m.className="ok";m.innerHTML=f.dev_note?`<span class="err">${esc(f.dev_note)}</span>`:f.dev_link?`${f.dev_error?`Email could not be sent (${esc(f.dev_error)}). `:"Email isn't set up on this local server. "}Use this link instead: <a href="${esc(f.dev_link)}" style="color:inherit;text-decoration:underline">Reset my password</a>`:"If that email has an account, a reset link is on its way. Check your spam folder too."}
      else if(mode==="reset"){await api("/api/reset",{method:"POST",json:{token:location.hash.slice(7),password:v("p")}});history.replaceState(null,"","/");authView("login");$("#am").className="ok";$("#am").textContent="Password updated. Sign in with your new password."}
      else{const d=await api("/api/"+mode,{method:"POST",json:{name:v("n"),email:v("e"),password:v("p")}});
        U={name:d.name,email:d.email};appView()}
    }catch(e){m.className="err";m.textContent=e.message}
    const g=$("#go");if(g)g.disabled=false;
  };
  const eye=$("#eye");if(eye)eye.onclick=()=>{const p=$("#p"),s=p.type==="password";p.type=s?"text":"password";eye.textContent=s?"Hide":"Show";eye.setAttribute("aria-pressed",s);eye.setAttribute("aria-label",s?"Hide password":"Show password")};
  $("#go").onclick=go;document.querySelectorAll(".box input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
}

/* ---------- app shell ---------- */
function appView(){
  $("#root").innerHTML=`<div class="shell"><aside><div class="logo">VIRA<b>JA</b></div>
   <button class="nav" data-t="match">Match</button><button class="nav" data-t="apps">Applications</button><button class="nav" data-t="dash">Dashboard</button>
   <div class="who">${esc(U&&U.name||"Signed in")}<br><span style="opacity:.7">${esc(U&&U.email||"")}</span><br><button class="link" id="out">Sign out</button></div></aside>
   <main id="main"></main></div>`;
  $("#out").onclick=logout;
  document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.t));
  go("match");
}
function go(t){
  document.querySelectorAll(".nav").forEach(b=>b.setAttribute("aria-current",b.dataset.t===t));
  ({match:matchView,apps:appsView,dash:dashView})[t]();
}

/* ---------- match ---------- */
function matchView(){
  $("#main").innerHTML=`<h3>Match your resume to a job</h3><p class="sub">Upload your resume and paste a job description to see your score and skill gaps.</p>
  <div class="card"><label class="drop" for="file"><input id="file" type="file" accept="application/pdf"><span id="fn"><b>Choose your resume</b><br>PDF with selectable text</span></label>
   <details style="margin-top:12px"><summary class="mute small" style="cursor:pointer">PDF is a scan, or text did not read? Paste your resume text instead</summary><textarea id="rt" placeholder="Paste your resume text here" style="margin-top:8px"></textarea></details>
   <label for="jd">Job description</label><textarea id="jd" placeholder="Paste the full job description"></textarea>
   <p style="margin:16px 0 0"><button class="btn sm" id="run">Analyze match</button> <span id="msg" class="mute" role="status"></span></p></div><div id="res">${last?"":""}</div>`;
  $("#file").onchange=e=>{const f=e.target.files[0];$("#fn").innerHTML=f?`<b>${esc(f.name)}</b><br>Ready to analyze`:"<b>Choose your resume</b>"};
  $("#run").onclick=async()=>{
    const f=$("#file").files[0],m=$("#msg");
    const rt=$("#rt").value.trim();
    if(!f&&rt.length<50){m.innerHTML='<span class="err">Choose your resume PDF, or paste your resume text.</span>';return}
    const fd=new FormData();if(f)fd.append("resume",f);fd.append("resume_text",rt);fd.append("jd",$("#jd").value);
    m.textContent="Analyzing...";$("#run").disabled=true;
    try{const r=await fetch("/api/analyze",{method:"POST",body:fd});
      const d=await r.json();if(r.status===401){U=null;authView("login");return}
      if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Check the fields and try again.");
      last=d;m.textContent="";renderRes(d)}catch(e){m.innerHTML=`<span class="err">${esc(e.message)}</span>`}
    $("#run").disabled=false;
  };
}
function renderRes(r){
  const x=r.resume;
  $("#res").innerHTML=`<div class="card hero">${ring(r.score)}<div><h3 style="margin:0">${r.matched.length} of ${r.matched.length+r.missing.length} skills matched</h3>
    <p class="mute" style="margin:4px 0 0">Required skills count double. Preferred skills count once.${r.required_years?` The role asks for ${r.required_years}+ years.`:""}</p></div></div>
  <div class="card krish" id="krish"><h4>Krish · your career coach</h4><p class="mute">Krish is reviewing your results...</p></div>
  <div class="grid2"><div class="card"><h4>Matched</h4>${chips(r.matched)}</div><div class="card"><h4>Missing</h4>${chips(r.missing,"bad")}</div></div>
  <div class="card"><h4>Resume check</h4>
   ${x.missing_sections.length?`<p>Missing sections: ${chips(x.missing_sections,"warn")}</p>`:""}
   ${x.contact_missing.length?`<p>Not found: ${chips(x.contact_missing,"warn")}</p>`:""}
   ${x.weak_bullets.length?`<ul>${x.weak_bullets.map(b=>`<li>"${esc(b.line)}"<br><span class="mute small">${esc(b.reason)}</span></li>`).join("")}</ul>`:'<p class="mute">No weak bullets detected.</p>'}</div>
  <div class="card"><h4>Skill gap plan</h4>${r.roadmap.length?`<ul>${r.roadmap.map(m=>`<li><b>${esc(m.skill)}</b>: ${esc(m.hint)}</li>`).join("")}</ul>`:'<p class="mute">No gaps for this job.</p>'}</div>
  <div class="card"><h4>Interview questions</h4><ul>${r.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
  <div class="card"><h4>Save this application</h4><div class="grid2"><div><label for="sc" style="margin-top:0">Company</label><input id="sc"></div><div><label for="sr" style="margin-top:0">Role</label><input id="sr"></div></div>
   <p style="margin:16px 0 0"><button class="btn sm" id="save">Save application</button> <span id="smsg" class="mute small"></span></p></div>`;
  krish(r,false);
  $("#save").onclick=async()=>{
    const company=$("#sc").value.trim(),role=$("#sr").value.trim();
    if(!company||!role){$("#smsg").innerHTML='<span class="err">Enter company and role.</span>';return}
    await api("/api/applications",{method:"POST",json:{company,role,match_score:r.score,jd_skills:[...r.matched,...r.missing],gaps:r.missing}});
    $("#smsg").innerHTML='<span class="ok">Saved. See it under Applications.</span>';
  };
}

const aiBlock=a=>`<p style="margin:16px 0 6px;font-weight:600">Bullet rewrites</p>${(a.rewrites||[]).map(w=>`<div class="rw"><span class="mute small">Before:</span> ${esc(w.original)}<br><span class="small" style="color:var(--good);font-weight:600">After:</span> ${esc(w.improved)}</div>`).join("")}<p style="margin:16px 0 6px;font-weight:600">7-day plan</p><ol>${(a.plan||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ol>${(a.tools_used||[]).length?`<p class="mute small">Tools Krish used: ${a.tools_used.map(esc).join(", ")}</p>`:""}`;
async function krish(r,ai){
  const x=r.resume,dot={red:"#e5283a",amber:"#e5a13a",green:"#35c27c"};
  if(ai)$("#kmsg").textContent="Krish is working with his tools. This can take about 20 seconds...";
  try{
    const d=await api("/api/krish",{method:"POST",json:{score:r.score,weak:x.weak_bullets.map(b=>b.line),matched:r.matched,missing:r.missing,ai}});
    $("#krish").innerHTML=`<h4>Krish · your career coach</h4><p style="font-size:18px;margin:0 0 12px"><b>${esc(d.headline)}</b></p>
     ${d.items.map(i=>`<div style="margin-bottom:6px"><i class="dot" style="background:${dot[i.level]}"></i>${esc(i.text)}</div>`).join("")}
     <p style="margin:16px 0 6px;font-weight:600">My recommendations</p><ol>${d.recommendations.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
     ${d.ai?aiBlock(d.ai):'<p style="margin:16px 0 0"><button class="btn sm ghost" id="kai">Ask Krish for bullet rewrites and a 7-day plan</button> <span id="kmsg" class="small"></span></p>'}`;
    const b=$("#kai");if(b)b.onclick=()=>krish(r,true);
  }catch(e){const m=$("#kmsg");if(m)m.innerHTML=`<span class="err">${esc(e.message)}</span>`;else $("#krish").innerHTML=`<h4>Krish · your career coach</h4><p class="err">${esc(e.message)}</p>`}
}

/* ---------- applications ---------- */
function appsView(){
  $("#main").innerHTML=`<h3>Applications</h3><p class="sub">Move each application through the pipeline as you hear back.</p>
  <div class="card"><div class="grid2"><div><label for="c" style="margin-top:0">Company</label><input id="c"></div><div><label for="r" style="margin-top:0">Role</label><input id="r"></div></div>
  <p style="margin:16px 0 0"><button class="btn sm" id="add">Add application</button></p></div><div class="card" id="list"></div>`;
  $("#add").onclick=async()=>{const company=$("#c").value.trim(),role=$("#r").value.trim();if(!company||!role)return;
    await api("/api/applications",{method:"POST",json:{company,role}});$("#c").value=$("#r").value="";load()};
  const tint=s=>`style="color:${COL[s]};background:${COL[s]}1a;border:1px solid ${COL[s]}55"`;
  async function load(){
    const rows=await api("/api/applications");
    $("#list").innerHTML=rows.length?`<table><tr><th>Company</th><th>Role</th><th>Match</th><th>Status</th><th></th></tr>`+rows.map(a=>`<tr><td><b>${esc(a.company)}</b></td><td>${esc(a.role)}</td><td>${a.match_score==null?"-":a.match_score+"%"}</td>
     <td><select data-id="${a.id}" ${tint(a.status)} aria-label="Status for ${esc(a.company)}">${STATUSES.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="x" data-del="${a.id}">Delete</button></td></tr>`).join("")+"</table>"
     :'<p class="mute" style="margin:0">No applications yet. Add one above, or save one from a match result.</p>';
    document.querySelectorAll("select[data-id]").forEach(s=>s.onchange=async()=>{await api("/api/applications/"+s.dataset.id,{method:"PATCH",json:{status:s.value}});load()});
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await api("/api/applications/"+b.dataset.del,{method:"DELETE"});load()});
  }
  load();
}

/* ---------- dashboard ---------- */
async function dashView(){
  $("#main").innerHTML='<h3>Dashboard</h3><p class="sub">Your search at a glance.</p><div id="d"></div>';
  const s=await api("/api/stats");
  const bars=(l,c)=>{const m=Math.max(1,...l.map(k=>k[1]));return l.length?l.map(([k,n])=>`<div class="sk"><span>${esc(k)}</span><div class="bar"><i style="width:${100*n/m}%;background:${c}"></i></div><span>${n}</span></div>`).join(""):'<p class="mute" style="margin:0">Save applications from the Match tab to fill this in.</p>'};
  let acc=0;const seg=STATUSES.map(k=>{const a=acc;acc+=100*s.counts[k]/(s.total||1);return `${COL[k]} ${a}% ${acc}%`}).join(",");
  const mx=Math.max(1,...s.by_day.map(d=>d[1]));
  $("#d").innerHTML=`<div class="kpis"><div class="kpi"><b>${s.total}</b>Applications</div><div class="kpi"><b>${s.counts.Interview}</b>Interviews</div><div class="kpi"><b>${s.counts.Rejected}</b>Rejections</div>
   <div class="kpi"><b>${s.response_rate}%</b>Response rate</div><div class="kpi"><b>${s.avg_score==null?"-":s.avg_score+"%"}</b>Avg match score</div></div>
  <div class="grid2"><div class="card"><h4>Status breakdown</h4><div class="hero" style="gap:22px"><div class="donut" style="background:conic-gradient(${s.total?seg:"var(--track) 0 100%"})"><span>${s.total}</span></div>
   <div class="leg">${STATUSES.map(k=>`<div><i style="background:${COL[k]}"></i>${k} <b>${s.counts[k]}</b></div>`).join("")}</div></div></div>
  <div class="card"><h4>Applications, last 14 days</h4><div class="cols">${s.by_day.map(([d,n])=>`<div title="${d}: ${n}"><i style="height:${100*n/mx}%"></i>${d.slice(0,2)}</div>`).join("")}</div></div>
  <div class="card"><h4>Most demanded skills</h4>${bars(s.top_skills,"#e5283a")}</div>
  <div class="card"><h4>Your biggest skill gaps</h4>${bars(s.top_gaps,"#e5a13a")}</div></div>`;
}

const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem("cp_theme",t);$("#theme").textContent=t==="dark"?"Light mode":"Dark mode"};
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(localStorage.getItem("cp_theme")||"dark");
addEventListener("hashchange",()=>{if(location.hash.startsWith("#reset="))authView("reset")});
if(location.hash.startsWith("#reset="))authView("reset");else fetch("/api/me").then(r=>r.ok?r.json():null).then(d=>{if(d){U=d;appView()}else authView("login")}).catch(()=>authView("login"));
</script>
